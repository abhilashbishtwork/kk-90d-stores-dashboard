<!doctype html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root {
    --green: #0a6b3f; --green-bg: #e3f3ea; --green-line: #9fd3b6;
    --ink: #1c1c1c; --muted: #707070; --line: #e3e3e3; --bg: #f7f6f3; --chip: #eeeeee; --red: #c8102e;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); }
  .wrap { padding: 10px; }
  .bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 10px; }
  .pill { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 4px 11px; cursor: pointer; font-size: 12px; }
  .pill.on { background: var(--green); border-color: var(--green); color: #fff; }
  .pill b { font-weight: 700; margin-left: 3px; }
  .spacer { flex: 1; }
  button.primary { background: var(--green); color: #fff; border: 0; border-radius: 8px; padding: 6px 12px; font-weight: 600; cursor: pointer; font-size: 12px; }
  input, select { border: 1px solid var(--line); border-radius: 7px; padding: 5px 7px; font: inherit; background: #fff; }
  #q { width: 150px; }
  #add-form { display: none; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-bottom: 10px; gap: 6px; flex-wrap: wrap; align-items: center; }
  #add-form.open { display: flex; }

  .store { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin-bottom: 8px; }
  .store.done { border-color: var(--green-line); }
  .head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .name { font-weight: 700; font-size: 14px; }
  .meta { color: var(--muted); font-size: 11px; }
  .type { font-size: 11px; padding: 1px 3px; border-radius: 5px; color: var(--muted); max-width: 150px; }
  .count { margin-left: auto; font-size: 11px; font-weight: 700; color: var(--muted); }
  .store.done .count { color: var(--green); }
  .link { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 11px; text-decoration: underline; padding: 0; }

  .groups { display: flex; flex-wrap: wrap; gap: 6px; }
  .grp { display: flex; align-items: stretch; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fafafa; }
  .grp.complete { background: var(--green-bg); border-color: var(--green-line); }
  .glabel { display: flex; align-items: center; padding: 0 8px; font-weight: 700; font-size: 11px; border-right: 1px solid var(--line); min-width: 58px; }
  .grp.complete .glabel { color: var(--green); border-right-color: var(--green-line); }
  .steps { display: flex; gap: 4px; padding: 4px; align-items: center; }
  .step { border: 0; border-radius: 6px; padding: 5px 8px; font-size: 11px; font-weight: 600; background: var(--chip); color: #8a8a8a; cursor: pointer; white-space: nowrap; }
  .step.on { background: var(--green); color: #fff; }
  .step:disabled { opacity: .45; cursor: not-allowed; }
  .rid { width: 92px; padding: 4px 6px; font-size: 11px; border-radius: 6px; }
  .rid.filled { border-color: var(--green-line); background: #fff; color: var(--green); font-weight: 600; }
  .rid:disabled { background: #f1f1f1; }

  #toast { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 7px 12px; border-radius: 8px; font-size: 12px; display: none; }
  #toast.err { background: var(--red); }
  .empty { padding: 26px; text-align: center; color: var(--muted); background: #fff; border: 1px dashed var(--line); border-radius: 10px; }
  #loading { color: var(--muted); padding: 10px 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <span id="status-bar"></span>
    <span id="city-bar"></span>
    <input type="search" id="q" placeholder="Search store">
    <span class="spacer"></span>
    <button class="primary" id="add-toggle">+ Add store</button>
  </div>

  <form id="add-form">
    <input type="text" id="f-name" placeholder="Store name" required maxlength="120" style="min-width:220px">
    <input type="text" id="f-city" placeholder="City" maxlength="60" list="city-list">
    <datalist id="city-list"></datalist>
    <select id="f-type"></select>
    <label class="meta">Go-live <input type="date" id="f-date"></label>
    <button class="primary" type="submit">Add</button>
    <button class="link" type="button" id="add-cancel">Cancel</button>
  </form>

  <div id="loading">Loading…</div>
  <div id="list"></div>
</div>
<div id="toast"></div>

<script>
// Steps inside a group unlock in order; a group turns green once every step
// (and its RID, where it has one) is filled.
const GROUPS = [
  { label: 'FSSAI', steps: [['fssai_ack', 'Acknowledgement'], ['fssai_licence', 'Licence']] },
  { label: 'Swiggy', steps: [['swiggy_fssai_pending', 'FSSAI pending'], ['swiggy_request', 'Request raised'], ['swiggy_live', 'Listing live']], rid: 'swiggy_rid' },
  { label: 'Zomato', steps: [['zomato_fssai_pending', 'FSSAI pending'], ['zomato_request', 'Request raised'], ['zomato_live', 'Listing live']], rid: 'zomato_rid' },
  { label: 'Ownly', steps: [['ownly_fssai_pending', 'FSSAI pending'], ['ownly_request', 'Request raised'], ['ownly_live', 'Listing live']], rid: 'ownly_rid' },
  { label: 'District', steps: [['zomato_district', 'Live']] },
  { label: 'Dineout', steps: [['swiggy_dineout', 'Live']] },
  { label: 'Google', steps: [['google_listing', 'Live']] },
];
const TOTAL = GROUPS.reduce((n, g) => n + g.steps.length + (g.rid ? 1 : 0), 0);
const ui = { city: 'All', status: 'Pending', q: '' };
let state = null;

function el(tag, props, kids) {
  const n = document.createElement(tag);
  Object.assign(n, props || {});
  (kids || []).forEach(k => n.appendChild(typeof k === 'string' ? document.createTextNode(k) : k));
  return n;
}
function toast(msg, isErr) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = isErr ? 'err' : ''; t.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(() => { t.style.display = 'none'; }, isErr ? 5000 : 1200);
}
function call(fn, args, onOk) {
  google.script.run
    .withSuccessHandler(s => { if (!s) { toast('Empty response — reload', true); return; } state = s; render(); if (onOk) onOk(); })
    .withFailureHandler(e => { toast('Not saved: ' + (e && e.message || e), true); render(); })[fn](...args);
}
function hasRid(r, g) { return !!g.rid && String(r[g.rid] || '').trim() !== ''; }
function groupDone(r, g) { return g.steps.every(([f]) => r[f]) && (!g.rid || hasRid(r, g)); }
function doneCount(r) { return GROUPS.reduce((n, g) => n + g.steps.filter(([f]) => r[f]).length + (hasRid(r, g) ? 1 : 0), 0); }
function isDone(r) { return doneCount(r) === TOTAL; }

function visible() {
  const q = ui.q.toLowerCase();
  return state.rows.filter(r => {
    if (r.archived) return false;
    if (ui.status === 'Pending' && isDone(r)) return false;
    if (ui.status === 'Done' && !isDone(r)) return false;
    if (ui.city !== 'All' && (r.city || '—') !== ui.city) return false;
    if (q && String(r.store_name).toLowerCase().indexOf(q) < 0) return false;
    return true;
  }).sort((a, b) => doneCount(a) - doneCount(b) || String(b.launch_date).localeCompare(String(a.launch_date)));
}

function pills(container, options, current, onPick) {
  container.textContent = '';
  options.forEach(([val, label, n]) => {
    const b = el('button', { className: 'pill' + (val === current ? ' on' : ''), type: 'button' }, [label]);
    if (n != null) b.appendChild(el('b', { textContent: String(n) }));
    b.addEventListener('click', () => onPick(val));
    container.appendChild(b);
  });
}

function stepButton(r, g, i) {
  const [field, label] = g.steps[i];
  const on = !!r[field];
  const prevDone = i === 0 || r[g.steps[i - 1][0]];
  const nextDone = i < g.steps.length - 1 && r[g.steps[i + 1][0]];
  // Only the next open step can be ticked, and only the last ticked step unticked.
  const b = el('button', { type: 'button', className: 'step' + (on ? ' on' : ''), textContent: label,
                           disabled: on ? !!nextDone : !prevDone });
  b.title = on ? (nextDone ? 'Untick the later step first' : 'Click to undo') : (prevDone ? 'Click when done' : 'Finish the previous step first');
  b.addEventListener('click', () => { b.disabled = true; call('setField', [r.key, field, !on], () => toast('Saved')); });
  return b;
}

function ridInput(r, g) {
  const unlocked = r[g.steps[g.steps.length - 1][0]];
  const val = String(r[g.rid] || '');
  const inp = el('input', { type: 'text', className: 'rid' + (val ? ' filled' : ''), value: val, maxLength: 40,
                            placeholder: 'RID', disabled: !unlocked && !val,
                            title: unlocked ? g.label + ' restaurant ID' : 'Available once listing is live' });
  const save = () => {
    const v = inp.value.trim();
    if (v !== val) call('setField', [r.key, g.rid, v], () => toast('RID saved'));
  };
  inp.addEventListener('change', save);
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') inp.blur(); });
  return inp;
}

function storeCard(r) {
  const card = el('div', { className: 'store' + (isDone(r) ? ' done' : '') });
  const typeSel = el('select', { className: 'type', title: 'Store type' });
  state.types.forEach(t => typeSel.appendChild(el('option', { value: t, textContent: t, selected: t === r.type })));
  typeSel.addEventListener('change', () => call('setField', [r.key, 'type', typeSel.value], () => toast('Saved')));
  const arch = el('button', { className: 'link', type: 'button', textContent: 'archive', title: 'Remove from the list once the store is fully up' });
  arch.addEventListener('click', () => call('setField', [r.key, 'archived', true], () => toast('Archived')));
  const meta = [r.city, r.launch_date ? 'go-live ' + r.launch_date : ''].filter(Boolean).join(' · ');
  card.appendChild(el('div', { className: 'head' }, [
    el('span', { className: 'name', textContent: r.store_name }), typeSel,
    el('span', { className: 'meta', textContent: meta }), arch,
    el('span', { className: 'count', textContent: `${doneCount(r)}/${TOTAL}` }),
  ]));

  const groups = el('div', { className: 'groups' });
  GROUPS.forEach(g => {
    const steps = el('div', { className: 'steps' }, g.steps.map((_, i) => stepButton(r, g, i)));
    if (g.rid) steps.appendChild(ridInput(r, g));
    groups.appendChild(el('div', { className: 'grp' + (groupDone(r, g) ? ' complete' : '') }, [
      el('div', { className: 'glabel', textContent: g.label }), steps,
    ]));
  });
  card.appendChild(groups);
  return card;
}

function render() {
  document.getElementById('loading').style.display = 'none';
  const active = state.rows.filter(r => !r.archived);
  const done = active.filter(isDone).length;
  pills(document.getElementById('status-bar'),
        [['Pending', 'Pending', active.length - done], ['Done', 'Fully live', done], ['All', 'All', active.length]],
        ui.status, v => { ui.status = v; render(); });

  const cities = [...new Set(active.map(r => r.city || '—'))].sort();
  const cityBar = document.getElementById('city-bar');
  if (cities.length > 1) pills(cityBar, [['All', 'All cities']].concat(cities.map(c => [c, c])), ui.city, v => { ui.city = v; render(); });
  else { cityBar.textContent = ''; ui.city = 'All'; }

  const dl = document.getElementById('city-list'); dl.textContent = '';
  cities.forEach(c => dl.appendChild(el('option', { value: c })));
  const ft = document.getElementById('f-type');
  if (!ft.options.length) state.types.forEach(t => ft.appendChild(el('option', { value: t, textContent: t })));

  const list = document.getElementById('list'); list.textContent = '';
  const rows = visible();
  if (!rows.length) {
    list.appendChild(el('div', { className: 'empty', textContent: active.length ? 'No stores in this view.' : 'No upcoming stores yet. Use "+ Add store" to add one.' }));
    return;
  }
  rows.forEach(r => list.appendChild(storeCard(r)));
}

document.getElementById('q').addEventListener('input', e => { ui.q = e.target.value; if (state) render(); });
document.getElementById('add-toggle').addEventListener('click', () => document.getElementById('add-form').classList.toggle('open'));
document.getElementById('add-cancel').addEventListener('click', () => document.getElementById('add-form').classList.remove('open'));
document.getElementById('add-form').addEventListener('submit', e => {
  e.preventDefault();
  const o = { store_name: document.getElementById('f-name').value, city: document.getElementById('f-city').value,
              type: document.getElementById('f-type').value, launch_date: document.getElementById('f-date').value };
  call('addStore', [o], () => { e.target.reset(); e.target.classList.remove('open'); ui.status = 'Pending'; toast('Store added'); render(); });
});

google.script.run
  .withSuccessHandler(s => { if (!s) { document.getElementById('loading').textContent = 'Could not load — reload the page.'; return; } state = s; render(); })
  .withFailureHandler(e => { document.getElementById('loading').textContent = 'Could not load: ' + (e && e.message || e); })
  .getState();
</script>
</body>
</html>
